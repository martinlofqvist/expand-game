<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXPAND! — Game Design CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #e1e1e1;
      --surface:  #ffffff;
      --surface2: #f4f4f4;
      --border:   rgba(0,0,0,0.08);
      --text:     #1a1a1a;
      --text2:    #555;
      --text3:    #999;
      --blue:     #2f6de0;
      --blue-bg:  #eef3fd;
      --green:    #3aaa6e;
      --green-bg: #edf7f3;
      --orange:   #d97a2f;
      --orange-bg:#fdf3eb;
      --red:      #d43a3a;
      --red-bg:   #fdeaea;
      --shadow:   0 2px 14px rgba(0,0,0,0.09);
      --shadow-sm:0 1px 4px rgba(0,0,0,0.06);
      --r:        12px;
      --r-sm:     8px;
    }

    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

    /* ── Editable fields ─────────────────────────────── */
    [contenteditable] {
      border-radius: 4px;
      padding: 1px 5px;
      margin: -1px -5px;
      cursor: text;
      outline: none;
      transition: background 0.12s, box-shadow 0.12s;
      display: inline-block;
      min-width: 20px;
    }
    [contenteditable]:hover { background: var(--blue-bg); }
    [contenteditable]:focus { background: var(--blue-bg); box-shadow: 0 0 0 2px var(--blue); }
    [contenteditable].empty:before {
      content: attr(data-ph);
      color: #bbb;
      font-style: italic;
      pointer-events: none;
    }
    [contenteditable].ticker-edit { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; min-width: 50px; }
    [contenteditable].name-edit { font-weight: 600; }
    [contenteditable].note-edit { font-size: 12px; color: var(--text2); font-weight: 400; }
    [contenteditable].flavour-edit { font-size: 12px; color: var(--text2); line-height: 1.6; }

    .num-field {
      display: inline-block; border: none; background: transparent;
      font: inherit; color: var(--blue); font-weight: 600; font-size: 12px;
      cursor: text; border-radius: 4px; padding: 1px 5px; margin: -1px -5px;
      min-width: 80px; outline: none;
      transition: background 0.12s, box-shadow 0.12s;
    }
    .num-field:hover { background: var(--blue-bg); }
    .num-field:focus { background: var(--blue-bg); box-shadow: 0 0 0 2px var(--blue); }
    .num-field::placeholder { color: #bbb; font-weight: 400; font-style: italic; }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--surface); box-shadow: var(--shadow-sm);
      padding: 0 24px; display: flex; align-items: center;
      justify-content: space-between; height: 58px;
      position: sticky; top: 0; z-index: 200;
    }
    .h-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: 0.06em; color: var(--blue); }
    .h-sep { width: 1px; height: 20px; background: var(--border); }
    .h-sub { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
    .h-right { display: flex; align-items: center; gap: 8px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 20px; border: none;
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
      cursor: pointer; letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost { background: var(--surface2); color: var(--text2); }
    .btn-ghost:hover { background: #e8e8e8; }

    #dirty-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--orange); display: none; flex-shrink: 0;
    }
    #dirty-dot.show { display: block; }

    /* ── Status bar ──────────────────────────────────── */
    .status-bar { background: var(--surface); border-top: 1px solid var(--border); padding: 7px 24px; display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .chip-ok  { background: var(--green-bg);  color: var(--green); }
    .chip-warn{ background: var(--orange-bg); color: var(--orange); }
    .chip-bad { background: var(--red-bg);    color: var(--red); }
    .chip-info{ background: var(--blue-bg);   color: var(--blue); }

    /* ── Tabs ────────────────────────────────────────── */
    nav.tabs { background: var(--surface); border-top: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 10px 24px; display: flex; gap: 4px; overflow-x: auto; }
    nav.tabs button { background: transparent; border: none; padding: 8px 16px; border-radius: 20px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer; white-space: nowrap; transition: background 0.12s, color 0.12s; }
    nav.tabs button:hover { background: var(--surface2); color: var(--text); }
    nav.tabs button.active { background: var(--blue); color: #fff; }

    main { padding: 22px 24px; max-width: 1320px; }
    .tab-section { animation: up 0.15s ease; }
    @keyframes up { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

    .sec-title { font-size: 19px; font-weight: 700; margin-bottom: 5px; }
    .sec-sub   { font-size: 12px; color: var(--text2); margin-bottom: 18px; line-height: 1.6; }

    /* ── Badges ──────────────────────────────────────── */
    .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .b-blue   { background: var(--blue-bg);   color: var(--blue); }
    .b-green  { background: var(--green-bg);  color: var(--green); }
    .b-orange { background: var(--orange-bg); color: var(--orange); }
    .b-gray   { background: var(--surface2);  color: var(--text2); }
    .b-red    { background: var(--red-bg);    color: var(--red); }

    .ticker-pill {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; background: var(--blue-bg); color: var(--blue);
      padding: 3px 8px; border-radius: 6px;
    }
    .ticker-pill.tbd { background: var(--surface2); color: var(--text3); }

    /* ── Progression (read-only) ─────────────────────── */
    .prog-list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
    .prog-row  { display: grid; grid-template-columns: 48px 74px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
    .prog-row:last-child { border-bottom: none; }
    .prog-row:hover { background: var(--surface2); }
    .prog-row.endgame { background: #f0f9ff; }
    .prog-row.tbd-row { opacity: 0.4; }
    .lvl { font-size: 10px; font-weight: 700; color: var(--text3); text-align: center; line-height: 1.3; }
    .prog-name-col { }
    .prog-name-col strong { font-size: 13px; font-weight: 700; display: block; }
    .prog-name-col span   { font-size: 11px; color: var(--text3); }
    .prog-thresh { font-size: 12px; font-weight: 600; color: var(--blue); white-space: nowrap; }
    .prog-thresh.starts { color: var(--green); }
    .pip-row { display: flex; gap: 3px; align-items: center; }
    .pip { width: 7px; height: 7px; border-radius: 2px; }
    .pip.on  { background: var(--blue); }
    .pip.off { background: #ddd; }
    .pip.tbd { background: transparent; border: 1.5px dashed #ccc; }
    .pip-gap { width: 5px; }
    .fork-block { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
    .fork-spine { width: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); padding: 12px; }
    .fork-label { font-size: 10px; font-weight: 700; color: var(--blue); text-align: center; line-height: 1.6; letter-spacing: 0.04em; }
    .fork-options { flex: 1; display: flex; }
    .fork-opt { flex: 1; padding: 12px 16px; border-right: 1px solid var(--border); display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; transition: background 0.1s; }
    .fork-opt:last-child { border-right: none; }
    .fork-opt:hover { background: var(--surface2); }
    .fork-or { display: flex; align-items: center; justify-content: center; padding: 0 10px; font-size: 11px; font-weight: 700; color: var(--text3); border-right: 1px solid var(--border); flex-shrink: 0; }
    .conn { height: 14px; margin-left: 60px; border-left: 2px solid #ddd; }

    /* ── Subsidiaries ────────────────────────────────── */
    .sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    .sub-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
    .sub-card.tbd-card { opacity: 0.5; }
    .sub-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; user-select: none; }
    .sub-head:hover { background: var(--surface2); }
    .sub-head-info { flex: 1; }
    .sub-head-info strong { font-size: 13px; font-weight: 700; display: block; line-height: 1.3; }
    .sub-head-info small  { font-size: 11px; color: var(--text3); }
    .sub-count { font-size: 11px; font-weight: 600; color: var(--blue); }
    .sub-arrow { font-size: 11px; color: var(--text3); transition: transform 0.18s; margin-left: 4px; }
    .sub-card.collapsed .sub-arrow { transform: rotate(-90deg); }
    .sub-card.collapsed .sub-body { display: none; }
    .sub-body { padding: 14px 15px; }
    .sub-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

    /* Sub header fields (editable) */
    .sub-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .field-row { display: flex; flex-direction: column; gap: 3px; }
    .field-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 2px; }

    /* Tier sections */
    .tier-sec { margin-bottom: 12px; }
    .tier-sec:last-child { margin-bottom: 0; }
    .tier-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tier-pill { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 20px; }
    .t1 { background: var(--blue-bg);   color: var(--blue); }
    .t2 { background: var(--orange-bg); color: var(--orange); }
    .t3 { background: var(--red-bg);    color: var(--red); }
    .tier-gate-wrap { margin-left: auto; display: flex; align-items: center; gap: 5px; }
    .tier-gate-label { font-size: 10px; color: var(--text3); }

    .upg-list { display: flex; flex-direction: column; gap: 2px; }
    .upg-row { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 6px; }
    .upg-row.has-val { background: var(--surface2); }
    .upg-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .upg-dot.on  { background: var(--blue); }
    .upg-dot.off { background: #ccc; }
    .upg-num { font-size: 10px; color: var(--text3); min-width: 14px; font-weight: 600; }

    /* ── Gov Track ───────────────────────────────────── */
    .gov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .gov-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
    .gov-card-head { padding: 13px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .gov-card-title { font-size: 13px; font-weight: 700; }
    .gov-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
    .gov-item { padding: 8px 10px; border-radius: 7px; background: var(--surface2); font-size: 12px; }
    .gov-item-name { font-weight: 500; }
    .gov-item-gate { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .gate-label { font-size: 10px; color: var(--text3); }

    /* ── HQ ──────────────────────────────────────────── */
    .hq-table { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
    .hq-row { display: grid; grid-template-columns: 2fr 150px 2fr; gap: 16px; align-items: start; padding: 13px 16px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
    .hq-row:last-child { border-bottom: none; }
    .hq-row:hover { background: var(--surface2); }
    .hq-row.head { background: var(--surface2); font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
    .hq-row.head:hover { background: var(--surface2); }
    .hq-row.endgame { background: #f0f9ff; }

    /* ── Synergies ───────────────────────────────────── */
    .syn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    .syn-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 17px; display: flex; flex-direction: column; gap: 10px; }
    .syn-card.final { background: #f0f9ff; }
    .syn-name-row { font-size: 14px; font-weight: 700; }
    .syn-req-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
    .syn-reqs { display: flex; flex-wrap: wrap; gap: 5px; }
    .req-tag { background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
    .syn-effect-row { font-size: 13px; font-weight: 600; color: var(--blue); }
    .syn-flavour-row { font-size: 12px; color: var(--text2); border-left: 3px solid var(--blue-bg); padding-left: 10px; line-height: 1.6; }

    /* ── Formula ─────────────────────────────────────── */
    .formula-wrap { max-width: 700px; display: flex; flex-direction: column; gap: 16px; }
    .formula-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; }
    .f-row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .f-row:last-child { border-bottom: none; }
    .f-row.total { border-top: 2px solid var(--text); padding-top: 14px; margin-top: 6px; }
    .f-op    { color: var(--blue); font-weight: 700; min-width: 18px; }
    .f-label { color: var(--text2); min-width: 130px; font-size: 12px; }
    .f-val   { font-weight: 600; }
    .f-table-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface2); }
    th { padding: 9px 14px; text-align: left; font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 11px 14px; font-size: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .td-key  { font-weight: 700; color: var(--blue); font-family: 'IBM Plex Mono', monospace; font-size: 11px; display: block; margin-bottom: 2px; }
    .alert { background: #fff8f0; border-radius: var(--r); box-shadow: var(--shadow); padding: 15px; border-left: 4px solid var(--orange); }
    .alert-title { font-size: 12px; font-weight: 700; color: var(--orange); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .alert-body  { font-size: 12px; color: var(--text2); line-height: 1.6; }

    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
</head>

    <div class="h-left">

      <span class="h-sub">Game Design CMS</span>
    </div>

      <div id="dirty-dot" title="Unsaved changes"></div>
      <button class="btn btn-ghost" onclick="resetChanges()">Revert</button>
      <button class="btn btn-primary" onclick="exportJSON()">⬇ Export game-data.json</button>

    <button onclick="showTab('hq',this)">HQ Upgrades</button>
    <button onclick="showTab('synergies',this)">Synergies</button>
    <button onclick="showTab('formula',this)">Formula</button>

  <main>

    <div id="tab-hq"           class="tab-section" hidden></div>
    <div id="tab-synergies"    class="tab-section" hidden></div>
    <div id="tab-formula"      class="tab-section" hidden></div>
  </main>
</div>

const CAT = { media:"Media", data:"Data", body:"Body", industrial:"Industrial", endgame:"Endgame" };
const CAT_CLS = { media:"b-blue", data:"b-green", body:"b-orange", industrial:"b-gray", endgame:"b-blue" };

function fmtN(n) {
  if (n===null||n===undefined) return '<span style="color:#bbb;font-style:italic">TBD</span>';
  if (n===0) return '<span style="color:var(--green);font-weight:600">Starts unlocked</span>';
  if (n>=1e18) return '$1 quintillion';
  if (n>=1e15) return '$'+(n/1e15).toFixed(0)+'Q';
  if (n>=1e12) return '$'+(n/1e12).toFixed(0)+'T';
  if (n>=1e9)  return '$'+(n/1e9).toFixed(0)+'B';
  if (n>=1e6)  return '$'+(n/1e6).toFixed(1)+'M';
  if (n>=1e3)  return '$'+(n/1e3).toFixed(0)+'K';
  return '$'+n;
}

function pips(sub) {
  return sub.tiers.map(t => {
    const filled = t.slots.filter(s=>s.trim()).length;
    return Array.from({length:5},(_,i) =>
      `<div class="pip ${i<filled?'on':filled===0?'tbd':'off'}"></div>`
    ).join('');
  }).join('<div class="pip-gap"></div>');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

let dirty = false;
function markDirty() {
  dirty = true;
  document.getElementById('dirty-dot').classList.add('show');
}

// EDIT HANDLERS
// ═══════════════════════════════════════════════════

// Update a nested value via dot-path ("subsidiaries.2.tiers.0.slots.3")
function setPath(obj, path, val) {
  const keys = path.split('.');
  let cur = obj;
  for (let i=0;i<keys.length-1;i++) cur = cur[keys[i]];
  cur[keys[keys.length-1]] = val;
}

function onEdit(el) {
  const path = el.dataset.path;
  const val = el.innerText.trim();
  if (path) { setPath(D, path, val); markDirty(); }
  // Toggle empty class for placeholder
  el.classList.toggle('empty', !val);
}

function onNumEdit(el) {
  const path = el.dataset.path;
  if (!path) return;
  const raw = el.value.trim();
  const val = raw === '' ? null : (isNaN(+raw) ? raw : +raw);
  setPath(D, path, val);
  markDirty();
}

function editKey(e, el) {
  if (e.key==='Enter' && !el.dataset.multi) { e.preventDefault(); el.blur(); }
}

function ed(path, val, cls='', ph='Click to edit…', multi=false) {
  const empty = (!val||!String(val).trim()) ? 'empty' : '';
  const v = val ? esc(val) : '';
  return `<span class="editable ${cls} ${empty}" contenteditable="true" data-path="${path}" data-ph="${ph}" ${multi?'data-multi="1"':''} oninput="onEdit(this)" onkeydown="editKey(event,this)">${v}</span>`;
}

function numEd(path, val, ph='TBD') {
  return `<input class="num-field" type="text" data-path="${path}" value="${val!==null&&val!==undefined?val:''}" placeholder="${ph}" onblur="onNumEdit(this)" onkeydown="if(event.key==='Enter')this.blur()" />`;
}

function renderProgression() {
  const byId={}, fg={}, fkById={};
  D.subsidiaries.forEach(s=>{byId[s.id]=s; if(s.forkId){if(!fg[s.forkId])fg[s.forkId]={}; fg[s.forkId][s.forkSide]=s;}});
  D.forks.forEach(f=>fkById[f.id]=f);
  const seq=[
    {t:'sub',id:'publishing'},{t:'fork',id:'fork1'},
    {t:'sub',id:'manufacturing'},{t:'sub',id:'stream'},{t:'fork',id:'fork2'},
    {t:'sub',id:'intelligence'},{t:'fork',id:'fork3'},
    {t:'sub',id:'life'},{t:'sub',id:'cognitive'},{t:'sub',id:'defense'},{t:'sub',id:'quantum'},
    {t:'fork',id:'fork4'},{t:'sub',id:'solar'},{t:'sub',id:'eternal'}
  ];
  let lvl=1, rows='';
  seq.forEach(e=>{
    if(e.t==='sub'){
      const s=byId[e.id]; if(!s)return;
      rows+=`<div class="prog-row${s.id==='eternal'?' endgame':''}${s.name==='TBD'?' tbd-row':''}">
        <div class="lvl">LVL<br>${lvl++}</div>
        <div class="ticker-pill${s.name==='TBD'?' tbd':''}">${esc(s.ticker)}</div>
        <div class="prog-name-col"><strong>${esc(s.name)}</strong><span>${CAT[s.category]||'TBD'}</span></div>
        <div class="prog-thresh${s.unlockThreshold===0?' starts':''}">${fmtN(s.unlockThreshold)}</div>
        <div class="pip-row">${pips(s)}</div>
      </div>`;
    } else {
      const fk=fkById[e.id], A=fg[e.id]?.A, B=fg[e.id]?.B;
      rows+=`<div class="conn"></div>
      <div class="fork-block">
        <div class="fork-spine"><div class="fork-label">${fk.label}<br>${fmtN(fk.threshold)}</div></div>
        <div class="fork-options">
          ${fOpt(A,lvl++)}
          <div class="fork-or">OR</div>
          ${fOpt(B,lvl++)}
        </div>
      </div>
      <div class="conn"></div>`;
    }
  });
  document.getElementById('tab-progression').innerHTML=`
    <div class="sec-title">Progression Path</div>
    <div class="sec-sub">${D.subsidiaries.length} subsidiaries · ${D.forks.length} forks · pips = T1/T2/T3 naming progress</div>
    <div class="prog-list">${rows}</div>`;
}

function fOpt(s,lvl){
  if(!s)return`<div class="fork-opt tbd-row" style="justify-content:center;align-items:center;display:flex"><span style="color:#bbb;font-style:italic;font-size:12px">TBD</span></div>`;
  return`<div class="fork-opt${s.name==='TBD'?' tbd-row':''}">
    <div class="ticker-pill${s.name==='TBD'?' tbd':''}">${esc(s.ticker)}</div>
    <div class="prog-name-col"><strong>${esc(s.name)}</strong><span>${CAT[s.category]||'TBD'}</span></div>
    <div class="pip-row">${pips(s)}</div>
  </div>`;
}

        <div class="gov-card-title">${nums[ci]} ${ed(`governmentTrack.categories.${ci}.name`, cat.name, 'name-edit')}</div>
        <span class="badge b-green">${cat.upgrades.length}/5</span>
      </div>
      <div class="gov-body">${items}</div>
    </div>`;
  }).join('');

  document.getElementById('tab-govtrack').innerHTML=`
    <div class="sec-title">Government Track</div>
    <div class="sec-sub">20 upgrades across 4 categories. All names and gate targets are editable. "Gates" field = which subsidiary tier this upgrade unlocks (e.g. publishing_tier2).</div>
    <div class="gov-grid">${cards}</div>`;
}

// ═══════════════════════════════════════════════════
// HQ UPGRADES (editable)

// ═══════════════════════════════════════════════════
// FORMULA
// ═══════════════════════════════════════════════════
function renderFormula() {
  const tRows = D.formula.components.map((c,i)=>`
    <tr>
      <td><span class="td-key">${c.key}</span><span style="font-size:11px;color:var(--text3)">${c.label}</span></td>
      <td style="font-style:italic;color:var(--text2)">${ed(`formula.components.${i}.formula`, c.formula, 'note-edit')}</td>
      <td>${ed(`formula.components.${i}.notes`, c.notes, 'note-edit', 'Notes…')}</td>
    </tr>`).join('');

  document.getElementById('tab-formula').innerHTML=`
    <div class="sec-title">Income Formula</div>
    <div class="sec-sub">All multipliers are multiplicative. Income calculated client-side every second.</div>
    <div class="formula-wrap">
      <div class="formula-card">
        <div>
          <div class="f-row"><span class="f-label">Base Income</span><span class="f-op">=</span><span class="f-val">Σ (subsidiary_rate × upgrade_boost)</span></div>
          <div class="f-row"><span class="f-op">×</span><span class="f-label">Tier Multiplier</span><span class="f-val">(1 + 0.5 per tier completed)</span></div>
          <div class="f-row"><span class="f-op">×</span><span class="f-label">Synergy</span><span class="f-val">2× – 4× if triggered</span></div>
          <div class="f-row"><span class="f-op">×</span><span class="f-label">HQ Global</span><span class="f-val">stacking HQ bonuses</span></div>
          <div class="f-row"><span class="f-op">×</span><span class="f-label">Gov Track</span><span class="f-val">(1 + 0.1 per gov upgrade owned)</span></div>
          <div class="f-row"><span class="f-op">×</span><span class="f-label">Prestige</span><span class="f-val">(total_revenue / threshold) ^ 0.15</span></div>
          <div class="f-row total"><span class="f-label" style="font-weight:700;color:var(--text)">Final Income</span><span class="f-op">=</span><span class="f-val" style="font-size:14px">Base × Tier × Synergy × HQ × Gov × Prestige</span></div>
        </div>
      </div>
      <div class="f-table-card"><table><thead><tr><th>Component</th><th>Formula</th><th>Notes</th></tr></thead><tbody>${tRows}</tbody></table></div>
      <div class="alert"><div class="alert-title">⚠ Open question — Prestige component</div><div class="alert-body">The Prestige multiplier is in the formula but no prestige/reset mechanic is described in the GDD. Soft continuous bonus, or stub for a NG+ system? Decide before finalising the formula.</div></div>
    </div>`;
}

// ═══════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════
function exportJSON() {
  // Deep copy D, convert tiers→upgrades format, handle _requiresRaw
  const out = JSON.parse(JSON.stringify(D));

  // Synergies: convert _requiresRaw back to requires array
  out.synergies.forEach(s => {
    if (s._requiresRaw !== undefined) {
      s.requires = s._requiresRaw.split(',').map(r=>r.trim()).filter(Boolean);
      delete s._requiresRaw;
    }
  });

  // Subsidiaries: convert tiers (slots) → upgrades (items)
  out.subsidiaries.forEach(s => {
    s.upgrades = s.tiers.map(t => ({
      tier: t.tier,
      govPrereq: t.govPrereq && t.govPrereq.trim() ? t.govPrereq.trim() : null,
      items: t.slots
        .filter(name => name && name.trim())
        .map(name => ({ id: slugify(name.trim()), name: name.trim() }))
    }));
    delete s.tiers;
  });

  // Download
  const json = JSON.stringify(out, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'game-data.json'; a.click();
  URL.revokeObjectURL(url);

  dirty = false;
  document.getElementById('dirty-dot').classList.remove('show');
}

function resetChanges() {
  if (!dirty || confirm('Revert all unsaved changes?')) location.reload();
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
function init() {
  renderStatus();
  renderProgression();
  renderSubsidiaries();
  renderGovTrack();
  renderHQ();
  renderSynergies();
  renderFormula();
}

init();
</script>
