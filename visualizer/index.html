<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXPAND! — Game Design CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#e1e1e1; --surface:#ffffff; --surface2:#f4f4f4; --border:rgba(0,0,0,0.08);
      --text:#1a1a1a; --text2:#555; --text3:#999;
      --blue:#2f6de0; --blue-bg:#eef3fd;
      --green:#3aaa6e; --green-bg:#edf7f3;
      --orange:#d97a2f; --orange-bg:#fdf3eb;
      --red:#d43a3a; --red-bg:#fdeaea;
      --shadow:0 2px 14px rgba(0,0,0,0.09); --shadow-sm:0 1px 4px rgba(0,0,0,0.06);
      --r:12px;
    }
    html,body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px; min-height:100vh; }

    /* ── Editable fields ── */
    [contenteditable] { border-radius:4px; padding:1px 5px; margin:-1px -5px; cursor:text; outline:none; display:inline-block; min-width:20px; transition:background .12s, box-shadow .12s; }
    [contenteditable]:hover { background:var(--blue-bg); }
    [contenteditable]:focus { background:var(--blue-bg); box-shadow:0 0 0 2px var(--blue); }
    [contenteditable].empty:before { content:attr(data-ph); color:#bbb; font-style:italic; pointer-events:none; }
    [contenteditable].ticker-edit { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; min-width:50px; }
    [contenteditable].name-edit { font-weight:600; }
    [contenteditable].note-edit { font-size:12px; color:var(--text2); font-weight:400; }
    [contenteditable].flavour-edit { font-size:12px; color:var(--text2); line-height:1.6; }
    .num-field { display:inline-block; border:none; background:transparent; font:inherit; color:var(--blue); font-weight:600; font-size:12px; cursor:text; border-radius:4px; padding:1px 5px; margin:-1px -5px; min-width:80px; outline:none; transition:background .12s, box-shadow .12s; }
    .num-field:hover { background:var(--blue-bg); }
    .num-field:focus { background:var(--blue-bg); box-shadow:0 0 0 2px var(--blue); }
    .num-field::placeholder { color:#bbb; font-weight:400; font-style:italic; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position:fixed; inset:0; background:var(--bg); z-index:999;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      transition:opacity .3s;
    }
    #loading-overlay.hidden { opacity:0; pointer-events:none; }
    .loader-logo { font-size:28px; font-weight:700; color:var(--blue); letter-spacing:.08em; }
    .loader-msg { font-size:13px; color:var(--text3); }
    .spinner { width:24px; height:24px; border:2.5px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Seed banner ── */
    #seed-banner {
      background:#fff8f0; border-bottom:1px solid #ffe0bb;
      padding:12px 24px; display:none; align-items:center; gap:12px;
    }
    #seed-banner.show { display:flex; }
    .seed-msg { font-size:13px; color:var(--orange); font-weight:500; flex:1; }

    /* ── Header ── */
    header { background:var(--surface); box-shadow:var(--shadow-sm); padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:58px; position:sticky; top:0; z-index:200; }
    .h-left { display:flex; align-items:center; gap:12px; }
    .logo { font-size:17px; font-weight:700; letter-spacing:.06em; color:var(--blue); }
    .h-sep { width:1px; height:20px; background:var(--border); }
    .h-sub { font-size:11px; font-weight:500; color:var(--text3); letter-spacing:.05em; text-transform:uppercase; }
    .h-right { display:flex; align-items:center; gap:8px; }
    .fb-dot { width:7px; height:7px; border-radius:50%; background:#ccc; flex-shrink:0; transition:background .3s; }
    .fb-dot.connected { background:var(--green); }
    .fb-dot.error     { background:var(--red); }
    #dirty-dot { width:7px; height:7px; border-radius:50%; background:var(--orange); display:none; flex-shrink:0; }
    #dirty-dot.show { display:block; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:20px; border:none; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; cursor:pointer; letter-spacing:.02em; transition:opacity .15s, transform .1s, background .15s; }
    .btn:active { transform:scale(.97); }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { opacity:.88; }
    .btn-primary:disabled { opacity:.45; cursor:default; }
    .btn-primary.saving { background:#5a8ff0; }
    .btn-primary.saved  { background:var(--green); }
    .btn-primary.error  { background:var(--red); }
    .btn-ghost { background:var(--surface2); color:var(--text2); }
    .btn-ghost:hover { background:#e8e8e8; }
    .btn-orange { background:var(--orange-bg); color:var(--orange); }
    .btn-orange:hover { background:#fae5d2; }

    /* ── Status bar ── */
    .status-bar { background:var(--surface); border-top:1px solid var(--border); padding:7px 24px; display:flex; gap:6px; flex-wrap:wrap; }
    .chip { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; }
    .chip-ok   { background:var(--green-bg);  color:var(--green); }
    .chip-warn { background:var(--orange-bg); color:var(--orange); }
    .chip-bad  { background:var(--red-bg);    color:var(--red); }
    .chip-info { background:var(--blue-bg);   color:var(--blue); }

    /* ── Tabs ── */
    nav.tabs { background:var(--surface); border-top:1px solid var(--border); box-shadow:var(--shadow-sm); padding:10px 24px; display:flex; gap:4px; overflow-x:auto; }
    nav.tabs button { background:transparent; border:none; padding:8px 16px; border-radius:20px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--text3); cursor:pointer; white-space:nowrap; transition:background .12s, color .12s; }
    nav.tabs button:hover { background:var(--surface2); color:var(--text); }
    nav.tabs button.active { background:var(--blue); color:#fff; }

    main { padding:22px 24px; max-width:1320px; }
    .tab-section { animation:up .15s ease; }
    @keyframes up { from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)} }
    .sec-title { font-size:19px; font-weight:700; margin-bottom:5px; }
    .sec-sub   { font-size:12px; color:var(--text2); margin-bottom:18px; line-height:1.6; }

    /* ── Shared component styles ── */
    .badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
    .b-blue{background:var(--blue-bg);color:var(--blue);} .b-green{background:var(--green-bg);color:var(--green);}
    .b-orange{background:var(--orange-bg);color:var(--orange);} .b-gray{background:var(--surface2);color:var(--text2);}
    .b-red{background:var(--red-bg);color:var(--red);}
    .ticker-pill { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.08em; background:var(--blue-bg); color:var(--blue); padding:3px 8px; border-radius:6px; }
    .ticker-pill.tbd { background:var(--surface2); color:var(--text3); }

    /* ── Progression ── */
    .prog-list { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
    .prog-row { display:grid; grid-template-columns:48px 74px 1fr auto auto; gap:14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); transition:background .1s; }
    .prog-row:last-child { border-bottom:none; }
    .prog-row:hover { background:var(--surface2); }
    .prog-row.endgame { background:#f0f9ff; }
    .prog-row.tbd-row { opacity:.4; }
    .lvl { font-size:10px; font-weight:700; color:var(--text3); text-align:center; line-height:1.3; }
    .prog-name-col strong { font-size:13px; font-weight:700; display:block; }
    .prog-name-col span   { font-size:11px; color:var(--text3); }
    .prog-thresh { font-size:12px; font-weight:600; color:var(--blue); white-space:nowrap; }
    .prog-thresh.starts { color:var(--green); }
    .pip-row { display:flex; gap:3px; align-items:center; }
    .pip { width:7px; height:7px; border-radius:2px; }
    .pip.on{background:var(--blue);} .pip.off{background:#ddd;} .pip.tbd{background:transparent;border:1.5px dashed #ccc;}
    .pip-gap { width:5px; }
    .fork-block { display:flex; border-bottom:1px solid var(--border); background:var(--surface); }
    .fork-spine { width:80px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-right:1px solid var(--border); padding:12px; }
    .fork-label { font-size:10px; font-weight:700; color:var(--blue); text-align:center; line-height:1.6; letter-spacing:.04em; }
    .fork-options { flex:1; display:flex; }
    .fork-opt { flex:1; padding:12px 16px; border-right:1px solid var(--border); display:grid; grid-template-columns:74px 1fr auto; gap:12px; align-items:center; transition:background .1s; }
    .fork-opt:last-child { border-right:none; }
    .fork-opt:hover { background:var(--surface2); }
    .fork-or { display:flex; align-items:center; justify-content:center; padding:0 10px; font-size:11px; font-weight:700; color:var(--text3); border-right:1px solid var(--border); flex-shrink:0; }
    .conn { height:14px; margin-left:60px; border-left:2px solid #ddd; }

    /* ── Subsidiaries ── */
    .sub-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:16px; }
    .sub-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
    .sub-card.tbd-card { opacity:.5; }
    .sub-head { display:flex; align-items:center; gap:10px; padding:13px 15px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; user-select:none; }
    .sub-head:hover { background:var(--surface2); }
    .sub-head-info { flex:1; }
    .sub-head-info strong { font-size:13px; font-weight:700; display:block; line-height:1.3; }
    .sub-head-info small  { font-size:11px; color:var(--text3); }
    .sub-count { font-size:11px; font-weight:600; color:var(--blue); }
    .sub-arrow { font-size:11px; color:var(--text3); transition:transform .18s; margin-left:4px; }
    .sub-card.collapsed .sub-arrow { transform:rotate(-90deg); }
    .sub-card.collapsed .sub-body { display:none; }
    .sub-body { padding:14px 15px; }
    .sub-meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .sub-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); }
    .field-row { display:flex; flex-direction:column; gap:3px; }
    .field-label { font-size:10px; font-weight:600; color:var(--text3); letter-spacing:.05em; text-transform:uppercase; margin-bottom:2px; }
    .tier-sec { margin-bottom:12px; }
    .tier-sec:last-child { margin-bottom:0; }
    .tier-hdr { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .tier-pill { font-size:10px; font-weight:700; letter-spacing:.04em; padding:3px 9px; border-radius:20px; }
    .t1{background:var(--blue-bg);color:var(--blue);} .t2{background:var(--orange-bg);color:var(--orange);} .t3{background:var(--red-bg);color:var(--red);}
    .tier-gate-wrap { margin-left:auto; display:flex; align-items:center; gap:5px; }
    .tier-gate-label { font-size:10px; color:var(--text3); }
    .upg-list { display:flex; flex-direction:column; gap:2px; }
    .upg-row { display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:6px; }
    .upg-row.has-val { background:var(--surface2); }
    .upg-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
    .upg-dot.on{background:var(--blue);} .upg-dot.off{background:#ccc;}
    .upg-num { font-size:10px; color:var(--text3); min-width:14px; font-weight:600; }

    /* ── Gov Track ── */
    .gov-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
    .gov-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
    .gov-card-head { padding:13px 15px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .gov-card-title { font-size:13px; font-weight:700; }
    .gov-body { padding:10px 12px; display:flex; flex-direction:column; gap:5px; }
    .gov-item { padding:8px 10px; border-radius:7px; background:var(--surface2); font-size:12px; }
    .gov-item-gate { display:flex; align-items:center; gap:6px; margin-top:4px; }
    .gate-label { font-size:10px; color:var(--text3); }

    /* ── HQ ── */
    .hq-table { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
    .hq-row { display:grid; grid-template-columns:2fr 150px 2fr; gap:16px; align-items:start; padding:13px 16px; border-bottom:1px solid var(--border); transition:background .1s; }
    .hq-row:last-child { border-bottom:none; }
    .hq-row:hover { background:var(--surface2); }
    .hq-row.head { background:var(--surface2); font-size:10px; font-weight:700; color:var(--text3); letter-spacing:.05em; text-transform:uppercase; }
    .hq-row.head:hover { background:var(--surface2); }
    .hq-row.endgame { background:#f0f9ff; }

    /* ── Synergies ── */
    .syn-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:16px; }
    .syn-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:17px; display:flex; flex-direction:column; gap:10px; }
    .syn-card.final { background:#f0f9ff; }
    .syn-req-label { font-size:10px; font-weight:700; color:var(--text3); letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px; }
    .syn-effect-row { font-size:13px; font-weight:600; color:var(--blue); }
    .syn-flavour-row { font-size:12px; color:var(--text2); border-left:3px solid var(--blue-bg); padding-left:10px; line-height:1.6; }

    /* ── Formula ── */
    .formula-wrap { max-width:700px; display:flex; flex-direction:column; gap:16px; }
    .formula-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:20px; }
    .f-row { display:flex; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .f-row:last-child { border-bottom:none; }
    .f-row.total { border-top:2px solid var(--text); padding-top:14px; margin-top:6px; }
    .f-op{color:var(--blue);font-weight:700;min-width:18px;} .f-label{color:var(--text2);min-width:130px;font-size:12px;} .f-val{font-weight:600;}
    .f-table-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    thead tr { background:var(--surface2); }
    th { padding:9px 14px; text-align:left; font-size:10px; font-weight:700; color:var(--text3); letter-spacing:.05em; text-transform:uppercase; border-bottom:1px solid var(--border); }
    td { padding:11px 14px; font-size:12px; border-bottom:1px solid var(--border); vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--surface2); }
    .td-key { font-weight:700; color:var(--blue); font-family:'IBM Plex Mono',monospace; font-size:11px; display:block; margin-bottom:2px; }
    .alert { background:#fff8f0; border-radius:var(--r); box-shadow:var(--shadow); padding:15px; border-left:4px solid var(--orange); }
    .alert-title { font-size:12px; font-weight:700; color:var(--orange); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em; }
    .alert-body  { font-size:12px; color:var(--text2); line-height:1.6; }

    ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="loader-logo">EXPAND!</div>
  <div class="spinner"></div>
  <div class="loader-msg" id="loader-msg">Connecting to Firebase…</div>
</div>

<!-- Seed banner (shown if Firestore is empty) -->
<div id="seed-banner">
  <div class="seed-msg">⚡ No data found in Firestore. Click to upload the default game data and get started.</div>
  <button class="btn btn-orange" id="seed-btn">Seed Firestore</button>
</div>

<div id="app" style="display:none">
  <header>
    <div class="h-left">
      <span class="logo">EXPAND!</span>
      <div class="h-sep" style="width:1px;height:20px;background:var(--border)"></div>
      <span class="h-sub">Game Design CMS</span>
    </div>
    <div class="h-right">
      <div class="fb-dot" id="fb-dot" title="Firebase"></div>
      <span style="font-size:11px;color:var(--text3);margin-right:4px" id="fb-label">Firebase</span>
      <div id="dirty-dot" title="Unsaved changes"></div>
      <button class="btn btn-ghost" onclick="window.revertChanges()">Revert</button>
      <button class="btn btn-ghost" onclick="window.exportJSON()" title="Download game-data.json">⬇ Export JSON</button>
      <button class="btn btn-primary" id="save-btn" onclick="window.saveToFirebase()">Save to Firebase</button>
    </div>
  </header>

  <div class="status-bar" id="status-bar"></div>

  <nav class="tabs">
    <button class="active" onclick="window.showTab('progression',this)">Progression</button>
    <button onclick="window.showTab('subsidiaries',this)">Subsidiaries</button>
    <button onclick="window.showTab('govtrack',this)">Gov Track</button>
    <button onclick="window.showTab('hq',this)">HQ Upgrades</button>
    <button onclick="window.showTab('synergies',this)">Synergies</button>
    <button onclick="window.showTab('formula',this)">Formula</button>
  </nav>

  <main>
    <div id="tab-progression"  class="tab-section"></div>
    <div id="tab-subsidiaries" class="tab-section" hidden></div>
    <div id="tab-govtrack"     class="tab-section" hidden></div>
    <div id="tab-hq"           class="tab-section" hidden></div>
    <div id="tab-synergies"    class="tab-section" hidden></div>
    <div id="tab-formula"      class="tab-section" hidden></div>
  </main>
</div>

}

}

window.saveToFirebase = async function() {
  setSaveBtn('saving', 'Saving…');

    await saveToFirestore(D);
    setSaveBtn('saved', '✓ Saved');

    document.getElementById('dirty-dot').classList.remove('show');

  }
};

// ── Export JSON ───────────────────────────────────────────────────
window.exportJSON = function() {
  const out = JSON.parse(JSON.stringify(D));
  // Convert tiers→upgrades for export
  out.subsidiaries.forEach(s => {
    s.upgrades = s.tiers.map(t => ({
      tier: t.tier,
      govPrereq: t.govPrereq && t.govPrereq.trim() ? t.govPrereq.trim() : null,
      items: t.slots.filter(n=>n&&n.trim()).map(n=>({id:slugify(n.trim()), name:n.trim()}))
    }));
    delete s.tiers;
  });
  out.synergies.forEach(s => { delete s._requiresRaw; });
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'game-data.json'; a.click();
};

// ── Utilities ─────────────────────────────────────────────────────
const CAT = {media:"Media",data:"Data",body:"Body",industrial:"Industrial",endgame:"Endgame"};
const CAT_CLS = {media:"b-blue",data:"b-green",body:"b-orange",industrial:"b-gray",endgame:"b-blue"};

function fmtN(n) {
  if(n===null||n===undefined) return '<span style="color:#bbb;font-style:italic">TBD</span>';
  if(n===0) return '<span style="color:var(--green);font-weight:600">Starts unlocked</span>';
  if(n>=1e18) return '$1 quintillion';
  if(n>=1e15) return '$'+(n/1e15).toFixed(0)+'Q';
  if(n>=1e12) return '$'+(n/1e12).toFixed(0)+'T';
  if(n>=1e9)  return '$'+(n/1e9).toFixed(0)+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(1)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(0)+'K';
  return '$'+n;
}

function pips(sub) {
  return sub.tiers.map(t => {
    const filled = t.slots.filter(s=>s.trim()).length;
    return Array.from({length:5},(_,i) =>
      `<div class="pip ${i<filled?'on':filled===0?'tbd':'off'}"></div>`
    ).join('');
  }).join('<div class="pip-gap"></div>');
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

// Nested path setter ("subsidiaries.2.tiers.0.slots.3")
function setPath(obj, path, val) {
  const keys = path.split('.');
  let cur = obj;
  for(let i=0;i<keys.length-1;i++) cur = cur[keys[i]];
  cur[keys[keys.length-1]] = val;
}

function markDirty() {
  dirty = true;
  document.getElementById('dirty-dot').classList.add('show');
}

// ── Edit handlers (exposed to window for inline onX) ──────────────
window.onEdit = function(el) {
  const path = el.dataset.path;
  const val  = el.innerText.trim();
  // Special case: synergy _requiresRaw → parse to array
  if (path && path.endsWith('._requiresRaw')) {
    const base = path.slice(0,-'._requiresRaw'.length);
    setPath(D, base+'.requires', val.split(',').map(r=>r.trim()).filter(Boolean));
    markDirty(); el.classList.toggle('empty',!val); return;
  }
  if (path) { setPath(D, path, val); markDirty(); }
  el.classList.toggle('empty',!val);
};

window.onNumEdit = function(el) {
  const path = el.dataset.path; if(!path) return;
  const raw = el.value.trim();
  setPath(D, path, raw==='' ? null : (isNaN(+raw) ? raw : +raw));
  markDirty();
};

window.editKey = function(e, el) {
  if(e.key==='Enter' && !el.dataset.multi){ e.preventDefault(); el.blur(); }
};

// Editable text helper
function ed(path, val, cls='', ph='Click to edit…', multi=false) {
  const empty = (!val||!String(val).trim()) ? 'empty' : '';
  return `<span class="editable ${cls} ${empty}" contenteditable="true" data-path="${path}" data-ph="${ph}" ${multi?'data-multi="1"':''} oninput="window.onEdit(this)" onkeydown="window.editKey(event,this)">${esc(val)}</span>`;
}

// Editable number helper
function numEd(path, val, ph='TBD') {
  return `<input class="num-field" type="text" data-path="${path}" value="${val!==null&&val!==undefined?val:''}" placeholder="${ph}" onblur="window.onNumEdit(this)" onkeydown="if(event.key==='Enter')this.blur()" />`;
}

function renderProgression() {
  const byId={},byIdx={},fg={},fkById={};
  D.subsidiaries.forEach((s,i)=>{byId[s.id]=s;byIdx[s.id]=i;if(s.forkId){if(!fg[s.forkId])fg[s.forkId]={};fg[s.forkId][s.forkSide]=s;}});
  D.forks.forEach((f,i)=>{ fkById[f.id]={...f,_idx:i}; });
  const seq=[{t:'sub',id:'publishing'},{t:'fork',id:'fork1'},{t:'sub',id:'manufacturing'},{t:'sub',id:'stream'},{t:'fork',id:'fork2'},{t:'sub',id:'intelligence'},{t:'fork',id:'fork3'},{t:'sub',id:'life'},{t:'sub',id:'cognitive'},{t:'sub',id:'defense'},{t:'sub',id:'quantum'},{t:'fork',id:'fork4'},{t:'sub',id:'solar'},{t:'sub',id:'eternal'}];
  let lvl=1,rows='';
  seq.forEach(e=>{
    if(e.t==='sub'){
      const s=byId[e.id];if(!s)return;
      const si=byIdx[e.id];
      rows+=`<div class="prog-row${s.id==='eternal'?' endgame':''}${s.name==='TBD'?' tbd-row':''}">
        <div class="lvl">LVL<br>${lvl++}</div>

        <div class="prog-thresh">${numEd(`subsidiaries.${si}.unlockThreshold`,s.unlockThreshold,'threshold')}</div>
        <div class="pip-row">${pips(s)}</div></div>`;
    } else {
      const fk=fkById[e.id],A=fg[e.id]?.A,B=fg[e.id]?.B;
      const fi=fk._idx;
      rows+=`<div class="conn"></div><div class="fork-block"><div class="fork-spine"><div class="fork-label">${ed(`forks.${fi}.label`,fk.label,'name-edit','Fork label')}<br>${numEd(`forks.${fi}.threshold`,fk.threshold,'threshold')}</div></div><div class="fork-options">${fOpt(A,lvl++,byIdx)}<div class="fork-or">OR</div>${fOpt(B,lvl++,byIdx)}</div></div><div class="conn"></div>`;

  document.getElementById('tab-progression').innerHTML=`<div class="sec-title">Progression Path</div><div class="sec-sub">${D.subsidiaries.length} subsidiaries · ${D.forks.length} forks · click any name or number to edit · pips = T1/T2/T3 naming progress</div><div class="prog-list">${rows}</div>`;
}

function fOpt(s,lvl,byIdx){
  if(!s) return`<div class="fork-opt tbd-row" style="justify-content:center;align-items:center;display:flex"><span style="color:#bbb;font-style:italic;font-size:12px">TBD</span></div>`;
  const si=byIdx?byIdx[s.id]:undefined;
  const nameEl = si!==undefined ? ed(`subsidiaries.${si}.name`,s.name,'name-edit','Name…') : esc(s.name);
  const tickEl = si!==undefined ? ed(`subsidiaries.${si}.ticker`,s.ticker,'ticker-edit','TICK') : esc(s.ticker);
  return`<div class="fork-opt${s.name==='TBD'?' tbd-row':''}"><div class="ticker-pill${s.name==='TBD'?' tbd':''}">${tickEl}</div><div class="prog-name-col"><strong>${nameEl}</strong><span>${CAT[s.category]||'TBD'}</span></div><div class="pip-row">${pips(s)}</div></div>`;

    const forkBadge=s.forkId?`<span class="badge b-blue">Fork ${s.forkId.slice(-1)} · ${s.forkSide}</span>`:'';
    const fields=`<div class="sub-fields">
      <div class="field-row"><div class="field-label">Name</div>${ed(`subsidiaries.${si}.name`,s.name,'name-edit','Name…')}</div>
      <div class="field-row"><div class="field-label">Ticker</div>${ed(`subsidiaries.${si}.ticker`,s.ticker,'ticker-edit','TICK')}</div>
      <div class="field-row"><div class="field-label">Unlock Threshold</div>${numEd(`subsidiaries.${si}.unlockThreshold`,s.unlockThreshold,'e.g. 250000')}</div>
      <div class="field-row"><div class="field-label">Base Rate ($/sec)</div>${numEd(`subsidiaries.${si}.baseRate`,s.baseRate,'TBD')}</div>
    </div>`;
    const tiers=s.tiers.map((t,ti)=>{
      const slots=t.slots.map((n,si2)=>{
        const has=!!n.trim();
        return`<div class="upg-row${has?' has-val':''}"><div class="upg-dot ${has?'on':'off'}"></div><span class="upg-num">${si2+1}</span>${ed(`subsidiaries.${si}.tiers.${ti}.slots.${si2}`,n,'note-edit','Upgrade name…')}</div>`;
      }).join('');
      const gate=t.tier>1?`<div class="tier-gate-wrap"><span class="tier-gate-label">Gov prereq:</span>${ed(`subsidiaries.${si}.tiers.${ti}.govPrereq`,t.govPrereq,'note-edit','gov_upgrade_id or blank')}</div>`:'';
      return`<div class="tier-sec"><div class="tier-hdr">${tPill(t.tier)}${gate}</div><div class="upg-list">${slots}</div></div>`;
    }).join('');
    return`<div class="sub-card${s.name==='TBD'?' tbd-card':''}" id="card-${s.id}">
      <div class="sub-head" onclick="window.toggleCard('${s.id}')">
        <div class="ticker-pill${s.name==='TBD'?' tbd':''}">${esc(s.ticker)}</div>
        <div class="sub-head-info"><strong>${esc(s.name)}</strong><small>${fmtN(s.unlockThreshold)}</small></div>
        <span class="sub-count">${named}/15</span><span class="sub-arrow">▾</span>
      </div>
      <div class="sub-body"><div class="sub-meta"><span class="badge ${CAT_CLS[s.category]||'b-gray'}">${CAT[s.category]||'TBD'}</span>${forkBadge}</div>${fields}${tiers}</div>
    </div>`;
  }).join('');
  document.getElementById('tab-subsidiaries').innerHTML=`<div class="sec-title">Subsidiaries</div><div class="sec-sub">Click any field to edit · changes auto-save to Firestore when you hit Save. <span style="color:var(--blue);font-weight:600">Tier 1</span> = corporate greed · <span style="color:var(--orange);font-weight:600">Tier 2</span> = actively harmful · <span style="color:var(--red);font-weight:600">Tier 3</span> = cartoonishly evil</div><div class="sub-grid">${cards}</div>`;
}

window.toggleCard = function(id){ document.getElementById('card-'+id).classList.toggle('collapsed'); };

// ── Gov Track ─────────────────────────────────────────────────────
function renderGovTrack() {
  const nums=['①','②','③','④'];
  const cards=D.governmentTrack.categories.map((cat,ci)=>`
    <div class="gov-card">
      <div class="gov-card-head"><div class="gov-card-title">${nums[ci]} ${ed(`governmentTrack.categories.${ci}.name`,cat.name,'name-edit')}</div><span class="badge b-green">${cat.upgrades.length}/5</span></div>
      <div class="gov-body">${cat.upgrades.map((u,ui)=>`<div class="gov-item"><div>${ed(`governmentTrack.categories.${ci}.upgrades.${ui}.name`,u.name,'note-edit','Upgrade name…')}</div><div class="gov-item-gate"><span class="gate-label">Gates:</span>${ed(`governmentTrack.categories.${ci}.upgrades.${ui}.gates`,u.gates,'note-edit','subsidiary_tier or blank')}</div></div>`).join('')}</div>
    </div>`).join('');
  document.getElementById('tab-govtrack').innerHTML=`<div class="sec-title">Government Track</div><div class="sec-sub">20 upgrades · all names and gate targets editable · "Gates" = which subsidiary tier this unlock requires (e.g. publishing_tier2)</div><div class="gov-grid">${cards}</div>`;
}

// ── HQ ────────────────────────────────────────────────────────────
function renderHQ() {
  const rows=D.hqUpgrades.map((u,i)=>`<div class="hq-row${u.id==='shareholder_value'?' endgame':''}"><div>${ed(`hqUpgrades.${i}.name`,u.name,'name-edit','Name…')}</div><div style="text-align:center">${numEd(`hqUpgrades.${i}.threshold`,u.threshold)}</div><div>${ed(`hqUpgrades.${i}.effect`,u.effect,'note-edit','Effect…')}</div></div>`).join('');
  document.getElementById('tab-hq').innerHTML=`<div class="sec-title">HQ Global Upgrades</div><div class="sec-sub">8 global upgrades · all fields editable · final upgrade triggers endgame</div><div class="hq-table"><div class="hq-row head"><div>Upgrade</div><div style="text-align:center">Threshold</div><div>Effect</div></div>${rows}</div>`;
}

// ── Synergies ─────────────────────────────────────────────────────
function renderSynergies() {
  const cards=D.synergies.map((s,i)=>`
    <div class="syn-card${s.id==='god_mode'?' final':''}">
      <div style="font-size:14px;font-weight:700">${ed(`synergies.${i}.name`,s.name,'name-edit','Synergy name…')}</div>
      <div><div class="syn-req-label">Requires (comma-separated)</div>${ed(`synergies.${i}._requiresRaw`,s.requires.join(', '),'note-edit','req1, req2…')}</div>
      <div class="syn-effect-row">${ed(`synergies.${i}.effect`,s.effect,'note-edit','Effect…')}</div>
      <div class="syn-flavour-row">${ed(`synergies.${i}.flavourText`,s.flavourText,'flavour-edit','Flavour text…',true)}</div>
    </div>`).join('');
  document.getElementById('tab-synergies').innerHTML=`<div class="sec-title">Synergies</div><div class="sec-sub">6 hidden synergies · all fields editable · God Mode gates Expand Eternal</div><div class="syn-grid">${cards}</div>`;
}

// ── Formula ───────────────────────────────────────────────────────
function renderFormula() {
  const tRows=D.formula.components.map((c,i)=>`<tr><td><span class="td-key">${c.key}</span><span style="font-size:11px;color:var(--text3)">${c.label}</span></td><td style="font-style:italic;color:var(--text2)">${ed(`formula.components.${i}.formula`,c.formula,'note-edit')}</td><td>${ed(`formula.components.${i}.notes`,c.notes,'note-edit','Notes…')}</td></tr>`).join('');
  document.getElementById('tab-formula').innerHTML=`<div class="sec-title">Income Formula</div><div class="sec-sub">All multipliers are multiplicative. Income calculated client-side every second.</div>
  <div class="formula-wrap">
    <div class="formula-card"><div>
      <div class="f-row"><span class="f-label">Base Income</span><span class="f-op">=</span><span class="f-val">Σ (subsidiary_rate × upgrade_boost)</span></div>
      <div class="f-row"><span class="f-op">×</span><span class="f-label">Tier Multiplier</span><span class="f-val">(1 + 0.5 per tier completed)</span></div>
      <div class="f-row"><span class="f-op">×</span><span class="f-label">Synergy</span><span class="f-val">2× – 4× if triggered</span></div>
      <div class="f-row"><span class="f-op">×</span><span class="f-label">HQ Global</span><span class="f-val">stacking HQ bonuses</span></div>
      <div class="f-row"><span class="f-op">×</span><span class="f-label">Gov Track</span><span class="f-val">(1 + 0.1 per gov upgrade owned)</span></div>
      <div class="f-row"><span class="f-op">×</span><span class="f-label">Prestige</span><span class="f-val">(total_revenue / threshold) ^ 0.15</span></div>
      <div class="f-row total"><span class="f-label" style="font-weight:700;color:var(--text)">Final Income</span><span class="f-op">=</span><span class="f-val" style="font-size:14px">Base × Tier × Synergy × HQ × Gov × Prestige</span></div>
    </div></div>
    <div class="f-table-card"><table><thead><tr><th>Component</th><th>Formula</th><th>Notes</th></tr></thead><tbody>${tRows}</tbody></table></div>
    <div class="alert"><div class="alert-title">⚠ Open question — Prestige component</div><div class="alert-body">The Prestige multiplier is in the formula but no prestige/reset mechanic is described in the GDD. Soft continuous bonus or NG+ prestige system? Needs a design decision.</div></div>
  </div>`;
}

// ── Render all ────────────────────────────────────────────────────
function renderAll() {
  renderStatus();
  renderProgression();
  renderSubsidiaries();
  renderGovTrack();
  renderHQ();
  renderSynergies();
  renderFormula();
  document.getElementById('app').style.display = 'block';
}

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  const overlay = document.getElementById('loading-overlay');
  const loaderMsg = document.getElementById('loader-msg');
  document.getElementById('seed-btn').onclick = window.seedFirestore;

  try {
    setFbStatus('connecting');
    loaderMsg.textContent = 'Fetching game data…';
    const loaded = await loadFromFirestore();

    if (loaded) {
      D = loaded;
      setFbStatus('connected');
    } else {
      // First run — no data in Firestore yet
      D = JSON.parse(JSON.stringify(DEFAULT_DATA));
      setFbStatus('connected');
      document.getElementById('seed-banner').classList.add('show');
    }
  } catch(e) {
    console.error('Firebase error:', e);
    loaderMsg.textContent = 'Firebase unavailable — using local data';
    setFbStatus('error');
    D = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await new Promise(r => setTimeout(r, 1500));
  }

  overlay.classList.add('hidden');
  setTimeout(() => overlay.remove(), 400);
  renderAll();
}

init();
</script>
